name: Release

# Publishes a release once the release PR (see release-pr.yml) is merged:
# publishes every package version that is not on npm yet, tags the commit,
# creates the GitHub release and starts the container build.
#
# npm authenticates this workflow through trusted publishing (OIDC), so there
# is no npm token. Each package's trusted publisher on npmjs.com must name this
# repository, this workflow file (release.yml) and the `release` environment.

on:
  push:
    branches:
      - master
    paths:
      - lerna.json
  # Re-run after a failed publish: only versions missing on npm get published.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'conventional-changelog/commitlint' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the tag, create the GitHub release
      id-token: write # npm trusted publishing and provenance
      actions: write # start the container build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: release
        run: |
          version=$(node -p 'require("./lerna.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "Tag v$version already exists, nothing to release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      # pnpm version is sourced from package.json `packageManager` field.
      - name: Setup pnpm
        if: steps.release.outputs.released != 'true'
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        if: steps.release.outputs.released != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.release.outputs.released != 'true'
        run: pnpm install --frozen-lockfile

      # Tests already ran on this exact commit in the merge queue.
      - name: Build packages
        if: steps.release.outputs.released != 'true'
        run: pnpm build

      - name: Publish to npm
        if: steps.release.outputs.released != 'true'
        run: pnpm lerna publish from-package --dist-tag "$DIST_TAG" --yes
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Tag the release
        if: steps.release.outputs.released != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
        env:
          TAG: ${{ steps.release.outputs.tag }}

      - name: Create GitHub release
        if: steps.release.outputs.released != 'true'
        run: |
          awk '/^##? \[[0-9]/ { n++ } n == 1' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ "$DIST_TAG" = next ]; then set -- --prerelease; else set -- --latest; fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "$@"
        env:
          TAG: ${{ steps.release.outputs.tag }}
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
          GH_TOKEN: ${{ github.token }}

      # Tags pushed with GITHUB_TOKEN don't trigger other workflows, so start
      # the container build here. It installs the new versions from npm, and
      # npm's CDN can take a few minutes to serve every new tarball.
      - name: Start container build
        if: steps.release.outputs.released != 'true'
        run: |
          sleep 300
          gh workflow run container-build.yml --ref "$TAG"
        env:
          TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
